# PlayMeet — production static hosting (P9)
# Serve dist/ behind nginx with long-lived hashed assets + pre-compressed .br siblings.
# Upload: npm run build:production  (writes foo.js.br next to foo.js)

server {
  listen 443 ssl http2;
  server_name playmeet.example;

  root /var/www/playmeet/dist;
  index index.html;

  # Service worker — always revalidate (precache list changes each build)
  location = /sw.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # HTML shell — always revalidate (SPA entry)
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # Vite hashed bundles — immutable + brotli_static / gzip_static pre-compress
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    brotli_static on;
    gzip_static on;
    try_files $uri $uri.br $uri.gz =404;
  }

  brotli on;
  brotli_comp_level 6;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  gzip on;
  gzip_vary on;
  gzip_comp_level  6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
}
